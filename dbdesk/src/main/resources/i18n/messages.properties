# DbDesk default (English) resource bundle.
# This file is the fallback for every locale; Chinese lives in messages_zh.properties.
# Rules:
#   - keys are `<domain>.<object>.<purpose>`, lowerCamelCase;
#   - every key here MUST exist in messages_zh.properties and vice versa;
#   - use {0}, {1} placeholders instead of string concatenation;
#   - inside MessageFormat patterns a literal single quote must be written as '';
#   - a leading/trailing space that must survive parsing is written as \u0020.

